<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Matsu 💗</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;}
body{
  overflow:hidden;display:flex;justify-content:center;align-items:center;
  font-family:"Trebuchet MS",Arial,sans-serif;color:#633052;
  background:linear-gradient(135deg,#fff0f6,#ffe1ec 48%,#f5dff0);
}
body:before,body:after{
 content:"♡";position:fixed;color:rgba(255,120,170,.16);
 font-size:150px;animation:float 7s ease-in-out infinite;pointer-events:none
}
body:before{left:4%;top:4%} body:after{right:4%;bottom:0;animation-delay:-3s}
@keyframes float{50%{transform:translateY(-18px) rotate(8deg)}}
.card{
 width:min(94vw,620px);min-height:410px;padding:38px 26px;
 text-align:center;border:2px solid rgba(255,255,255,.85);border-radius:30px;
 background:rgba(255,255,255,.55);backdrop-filter:blur(10px);
 box-shadow:0 20px 55px rgba(120,50,90,.15);position:relative;z-index:2
}
.heartIcon{font-size:55px;margin-bottom:5px}
h1{margin:4px 0 12px;font-size:clamp(38px,8vw,58px)}
.question{font-size:clamp(22px,5vw,30px);font-weight:700;margin:0 0 24px}
.buttons{height:150px;position:relative;display:flex;justify-content:center;align-items:center;gap:24px}
button{
 border:0;border-radius:999px;padding:15px 31px;font-size:20px;font-weight:700;
 cursor:pointer;box-shadow:0 8px 18px rgba(100,40,80,.18);touch-action:manipulation
}
#yes{background:#ff709e;color:#fff;transition:transform .15s}
#yes:hover{transform:scale(1.08)}
#no{
 background:#fff;color:#777;position:absolute;
 transition:left .12s ease,top .12s ease,transform .12s ease
}
.small{font-size:13px;opacity:.55;margin-top:8px}
#questionCard{display:none}.success{display:none}
.success h1{font-size:clamp(34px,7vw,54px);margin-top:8px}
.success img{
 width:min(72vw,310px);max-height:330px;object-fit:contain;border-radius:24px;
 border:5px solid white;box-shadow:0 12px 35px rgba(80,40,80,.22);margin-top:5px
}
.heart{position:fixed;bottom:-30px;font-size:24px;animation:rise 4s linear forwards;pointer-events:none;z-index:5}
@keyframes rise{to{transform:translateY(-110vh) rotate(360deg);opacity:0}}
</style>
</head>
<body>

<div class="card" id="introCard">
  <div class="heartIcon">💌</div>
  <h1 style="font-size:clamp(32px,7vw,52px)">Matsu...</h1>
  <p class="question" style="font-size:clamp(20px,4.5vw,27px);font-weight:600">Tienes una pequeña sorpresa 💗</p>
  <button id="openBtn" style="background:#ff709e;color:white;">Abrir 💕</button>
</div>

<div class="card" id="questionCard">
  <div class="heartIcon">💗</div>
  <h1>Matsu...</h1>
  <p class="question">¿Quieres ser mi novia :D?</p>
  <div class="buttons" id="arena">
    <button id="yes">Sí 💕</button>
    <button id="no">No 🙈</button>
  </div>
</div>

<script>document.getElementById("openBtn").addEventListener("click",()=>{document.getElementById("introCard").style.display="none";document.getElementById("questionCard").style.display="block";});

const noBtn=document.getElementById("no"), arena=document.getElementById("arena");
function moveNo(){
 const r=arena.getBoundingClientRect(), b=noBtn.getBoundingClientRect();
 noBtn.style.left=(5+Math.random()*Math.max(5,r.width-b.width-10))+"px";
 noBtn.style.top=(5+Math.random()*Math.max(5,r.height-b.height-10))+"px";
 noBtn.style.transform="rotate("+((Math.random()*18)-9)+"deg)";
}
["mouseenter","pointerdown","touchstart","focus"].forEach(e=>noBtn.addEventListener(e,x=>{x.preventDefault();moveNo()}));
noBtn.addEventListener("click",e=>{e.preventDefault();moveNo()});
document.getElementById("yes").addEventListener("click",()=>{
 document.getElementById("questionCard").style.display="none";
 document.getElementById("successCard").style.display="block";
 for(let i=0;i<22;i++)setTimeout(()=>{
  const h=document.createElement("div");h.className="heart";
  h.textContent=["💗","💕","💖","✨"][Math.floor(Math.random()*4)];
  h.style.left=Math.random()*100+"vw";h.style.animationDuration=3+Math.random()*3+"s";
  document.body.appendChild(h);setTimeout(()=>h.remove(),6500);
 },i*100);
});
</script>
